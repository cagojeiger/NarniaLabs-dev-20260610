[project]
name = "narnia-ml-failure-diagnosis"
version = "0.1.0"
description = "ML 학습 워크플로우 실패 진단 — 워크플로우 PoC(DVC) + 실패 로그 생성기 (Python side)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dvc>=3.0",
    "torch>=2.2",
    "torchvision>=0.17",
]

[tool.uv]
# torch 휠이 아직 Python 3.14 를 지원하지 않아 ML 파트는 3.12 로 핀.

# Linux(=Docker) 에서는 CPU 전용 torch 휠을 써서 이미지를 가볍게 만든다.
# macOS(로컬 개발)는 기본 PyPI 휠(arm64 = 이미 CPU)을 그대로 쓴다.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mljob"]
